add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), payment=(self), microphone=(), usb=(), bluetooth=(), midi=(), serial=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://onecrmtatva.blob.core.windows.net https://flagcdn.com https://*.googleapis.com https://*.gstatic.com https://tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: wss: https://onecrmtatva.blob.core.windows.net https://*.googleapis.com; media-src 'self' blob: https://onecrmtatva.blob.core.windows.net; worker-src 'self' blob:; frame-src 'self' https://*.sharepoint.com https://onedrive.live.com https://1drv.ms; base-uri 'self'; form-action 'self'; object-src 'none'" always;
