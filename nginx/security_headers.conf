# TATVA: overrides frappe_docker's snippet. Values per the OWASP HTTP Headers Cheat Sheet.

# SAMEORIGIN not DENY — frappe frames its own print preview.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
# 0, not "1; mode=block" — OWASP says disable it; the auditor is gone from every browser and was itself abusable.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;
# (self) = our pages only, never an embedded frame: camera for the uploader button, geolocation for Near Me + task GPS, payment for the gateway's browser checkout sheet.
add_header Permissions-Policy "camera=(self), geolocation=(self), payment=(self), microphone=(), usb=(), bluetooth=(), midi=(), serial=()" always;
# Report-only: browser logs, enforces nothing. No frame-ancestors (would intersect with frappe's on embeddable web forms). Before enforcing, note form-action 'self' blocks a gateway checkout POST — read the violations for the domain, or drop it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://onecrmtatva.blob.core.windows.net; font-src 'self' data:; connect-src 'self' wss: https://onecrmtatva.blob.core.windows.net; base-uri 'self'; form-action 'self'; object-src 'none'" always;
