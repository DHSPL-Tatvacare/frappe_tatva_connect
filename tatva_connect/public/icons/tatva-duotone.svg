<!-- Tatva Connect's dual-tone desk icons, in the shape of frappe's module-icons.svg: filled 24x24 symbols
     toned by the duotone-light and duotone-dark custom properties, so frappe's dock and header rules colour them. -->

<svg id="tatva-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* Motion only, while a dock tile is hovered: frappe's dock sets the icon-motion-opacity custom
		   property to 1 there (dock.scss), the same trigger frappe's own module icons read. Tones stay. */
		@media (prefers-reduced-motion: no-preference) {
			.tt-ticket, .tt-bar, .tt-cap, .tt-tassel, .tt-page-left, .tt-page-right,
			.tt-letter, .tt-rack-top, .tt-rack-bottom {
				transform-box: fill-box;
				transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
			}
			.tt-ticket { transform-origin: center; transform: rotate(calc(var(--icon-motion-opacity, 0) * -10deg)); }
			.tt-bar { transform-origin: bottom; transform: scaleY(calc(1 + var(--icon-motion-opacity, 0) * 0.22)); }
			.tt-bar-2 { transition-delay: 0.06s; }
			.tt-bar-3 { transition-delay: 0.12s; }
			.tt-cap { transform: translateY(calc(var(--icon-motion-opacity, 0) * -2px)); }
			.tt-tassel { transform-origin: top; transform: rotate(calc(var(--icon-motion-opacity, 0) * 18deg)); transition-delay: 0.08s; }
			.tt-page-left { transform: translateX(calc(var(--icon-motion-opacity, 0) * -1.2px)); }
			.tt-page-right { transform: translateX(calc(var(--icon-motion-opacity, 0) * 1.2px)); }
			.tt-letter { opacity: var(--icon-motion-opacity, 0); transform: translateY(calc(-4px + var(--icon-motion-opacity, 0) * 5px)); }
			.tt-rack-top { transform: translateY(calc(var(--icon-motion-opacity, 0) * -1.2px)); }
			.tt-rack-bottom { transform: translateY(calc(var(--icon-motion-opacity, 0) * 1.2px)); }
			.tt-knob { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
			.tt-knob-on { transform: translateX(calc(var(--icon-motion-opacity, 0) * -10px)); }
			.tt-drop { transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1); transform: translateY(calc(var(--icon-motion-opacity, 0) * 5px)); }
			.tt-drop-2 { transition-delay: 0.07s; }
			.tt-drop-3 { transition-delay: 0.14s; }
			.tt-leaf { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); transform: translateY(calc(var(--icon-motion-opacity, 0) * 1.6px)); }
			.tt-leaf-2 { transition-delay: 0.07s; }
			.tt-leaf-3 { transition-delay: 0.14s; }
			.tt-lens { transition: transform 0.5s cubic-bezier(0.34, 1.3, 0.64, 1); transform: translateY(calc(var(--icon-motion-opacity, 0) * -6px)); }
			.tt-knob-off { transform: translateX(calc(var(--icon-motion-opacity, 0) * 10px)); transition-delay: 0.06s; }
		}
		/* With motion turned down, the letter that drops into the inbox is never drawn. */
		@media (prefers-reduced-motion: reduce) {
			.tt-letter { opacity: 0; }
		}
	</style>
	<symbol viewBox="0 0 24 24" id="icon-tatva-ticket-duotone" stroke="none" style="overflow: visible">
		<g class="tt-ticket">
		<path d="M3 5.5H21A1 1 0 0 1 22 6.5V9.75A2.25 2.25 0 0 0 22 14.25V17.5A1 1 0 0 1 21 18.5H3A1 1 0 0 1 2 17.5V14.25A2.25 2.25 0 0 0 2 9.75V6.5A1 1 0 0 1 3 5.5Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="15.25" y="7" width="1.5" height="2.25" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="15.25" y="10.875" width="1.5" height="2.25" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="15.25" y="14.75" width="1.5" height="2.25" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="5.5" y="9.25" width="7" height="1.5" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="5.5" y="13.25" width="4.5" height="1.5" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-chart-duotone" stroke="none" style="overflow: visible">
		<rect x="2.5" y="2.5" width="19" height="19" rx="3.5" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect class="tt-bar tt-bar-1" x="6.5" y="12" width="2.75" height="6" rx="1" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect class="tt-bar tt-bar-2" x="10.625" y="6.5" width="2.75" height="11.5" rx="1" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect class="tt-bar tt-bar-3" x="14.75" y="9.5" width="2.75" height="8.5" rx="1" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-graduation-duotone" stroke="none" style="overflow: visible">
		<path d="M5.5 11.25V15.75C5.5 17.8 8.4 19.75 12 19.75S18.5 17.8 18.5 15.75V11.25L12 14.6Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="tt-cap"><path d="M11.55 3.6A1 1 0 0 1 12.45 3.6L21.95 8.45A.6.6 0 0 1 21.95 9.55L12.45 14.4A1 1 0 0 1 11.55 14.4L2.05 9.55A.6.6 0 0 1 2.05 8.45Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect class="tt-tassel" x="19.75" y="9.25" width="1.5" height="6.25" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" /></g>
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-book-open-duotone" stroke="none" style="overflow: visible">
		<g class="tt-page-left"><path d="M2 5.6C5.1 4.6 8.6 4.9 11.25 6.6V20.1C8.6 18.4 5.1 18.1 2 19.1Z" style="fill: var(--duotone-light, var(--ink-gray-3))" /></g>
		<g class="tt-page-right"><path d="M22 5.6C18.9 4.6 15.4 4.9 12.75 6.6V20.1C15.4 18.4 18.9 18.1 22 19.1Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		</g>
		<rect x="11.25" y="6" width="1.5" height="14.6" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="tt-page-left"><rect x="4.5" y="9" width="4.5" height="1.3" rx="0.65" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="4.5" y="12" width="4.5" height="1.3" rx="0.65" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
		<g class="tt-page-right"><rect x="15" y="9" width="4.5" height="1.3" rx="0.65" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="15" y="12" width="4.5" height="1.3" rx="0.65" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" /></g>
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-inbox-duotone" stroke="none" style="overflow: visible">
		<path d="M5.1 4.9A2 2 0 0 1 7 3.5H17A2 2 0 0 1 18.9 4.9L22 13V19A2 2 0 0 1 20 21H4A2 2 0 0 1 2 19V13Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect class="tt-letter" x="8" y="6" width="8" height="5.5" rx="1" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path d="M2 13H7.5L9 16H15L16.5 13H22V19A2 2 0 0 1 20 21H4A2 2 0 0 1 2 19Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-server-duotone" stroke="none" style="overflow: visible">
		<g class="tt-rack-top"><rect x="2.5" y="3" width="19" height="8" rx="2" style="fill: var(--duotone-light, var(--ink-gray-3))" /><circle cx="6.75" cy="7" r="1.25" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" /><rect x="11" y="6.25" width="7" height="1.5" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" /></g>
		<g class="tt-rack-bottom"><rect x="2.5" y="13" width="19" height="8" rx="2" style="fill: var(--duotone-light, var(--ink-gray-3))" /><circle class="tt-led" cx="6.75" cy="17" r="1.25" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" /><rect x="11" y="16.25" width="7" height="1.5" rx="0.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" /></g>
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-toggles-duotone" stroke="none" style="overflow: visible">
		<rect x="2" y="3.5" width="20" height="7.5" rx="3.75" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<circle class="tt-knob tt-knob-on" cx="17.25" cy="7.25" r="2.6" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="2" y="13" width="20" height="7.5" rx="3.75" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<circle class="tt-knob tt-knob-off" cx="6.75" cy="16.75" r="2.6" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-funnel-duotone" stroke="none" style="overflow: visible">
		<circle class="tt-drop tt-drop-1" cx="8" cy="3" r="1.3" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle class="tt-drop tt-drop-2" cx="12" cy="1.9" r="1.3" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle class="tt-drop tt-drop-3" cx="16" cy="3" r="1.3" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path d="M3.5 8.5H20.5L14.5 15V19.5A1 1 0 0 1 13.5 20.5H10.5A1 1 0 0 1 9.5 19.5V15Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="2.5" y="6.25" width="19" height="2.6" rx="1.3" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-inspect-duotone" stroke="none" style="overflow: visible">
		<rect x="3.5" y="2.5" width="13" height="17.5" rx="2" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="6" y="6.25" width="8" height="1.4" rx="0.7" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="6" y="9.25" width="6" height="1.4" rx="0.7" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect x="6" y="12.25" width="7" height="1.4" rx="0.7" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="tt-lens">
			<path fill-rule="evenodd" d="M15.5 11.3a4.2 4.2 0 1 0 0 8.4a4.2 4.2 0 1 0 0-8.4Z M15.5 12.9a2.6 2.6 0 1 1 0 5.2a2.6 2.6 0 1 1 0-5.2Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path d="M17.9 16.55L21.85 20.5L20.5 21.85L16.55 17.9Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<circle cx="21.18" cy="21.18" r="0.95" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
