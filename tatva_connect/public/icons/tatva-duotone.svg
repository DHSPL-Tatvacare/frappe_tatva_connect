		<circle class="tt-leaf tt-leaf-1" cx="5" cy="17.75" r="2.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle class="tt-leaf tt-leaf-2" cx="12" cy="17.75" r="2.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle class="tt-leaf tt-leaf-3" cx="19" cy="17.75" r="2.75" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>

	<symbol viewBox="0 0 24 24" id="icon-tatva-ticket-inspect-duotone" stroke="none" style="overflow: visible">
		<path d="M3 4.5H19A1 1 0 0 1 20 5.5V8.5A2.1 2.1 0 0 0 20 12.7V15.5A1 1 0 0 1 19 16.5H3A1 1 0 0 1 2 15.5V12.7A2.1 2.1 0 0 0 2 8.5V5.5A1 1 0 0 1 3 4.5Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="5" y="8" width="7" height="1.4" rx="0.7" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
