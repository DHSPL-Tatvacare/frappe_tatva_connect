rules:
  # NOTE: two rules retired — `frappe-raw-sql-interpolation` and `frappe-ignore-permissions-true`.
  # Their surface (raw-SQL injection, ignore_permissions bypass) is OWNED by the authoritative AST
  # locks tatva_connect/tests/static/{test_no_sql_injection,test_no_perm_bypass}.py — which run in CI, scope
  # to the real request surface, and clear deliberate sites via `# sqli-ok:` / `# authz-ok:` markers.
  # semgrep has no marker mechanism, so it re-flagged every already-cleared/internal site (67, all
  # verified safe) — noise on a surface another gate already guards (one brain, A.8 / S.2).

  # Shell command injection surface.
  - id: subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: "subprocess called with shell=True — command injection risk. Pass an argv list instead."
    metadata:
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  # TLS verification disabled — MITM exposure on outbound calls (WATI/Acefone/Azure).
  - id: requests-verify-false
    languages: [python]
    severity: ERROR
    message: "TLS verification disabled (verify=False) — MITM risk on an outbound HTTPS call."
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)

  # Weak hash for any security purpose.
  - id: weak-hash-md5-sha1
    languages: [python]
    severity: WARNING
    message: "MD5/SHA1 is cryptographically broken — use hashlib.sha256+ for any security use."
    metadata:
      cwe: "CWE-327: Use of a Broken Cryptographic Algorithm"
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
